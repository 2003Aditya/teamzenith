<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Emergency Mesh Chat + Map</title>
  <style>
    body { font-family: Arial, sans-serif; }
    #chat { height: 200px; overflow-y: scroll; border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; }
    #msgInput { width: 80%; }
    #map { height: 300px; margin-top: 20px; border: 1px solid #ccc; }
  </style>
  <link rel="stylesheet" href="/leaflet/leaflet.css" />
</head>
<body>
  <h2>Emergency Mesh Chat</h2>
  <div id="chat"></div>
  <input id="nameInput" type="text" placeholder="Your Name" />
  <input id="msgInput" type="text" placeholder="Type a message" />
  <button onclick="sendMsg()">Send</button>

  <div id="map"></div>

  <script src="/leaflet/leaflet.js"></script>
  <script>
    const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
    const chat = document.getElementById('chat');
    const markers = {};
    let map, myLat, myLng;

    ws.onmessage = function(event) {
      const data = JSON.parse(event.data);

      // Display chat message
      if (data.sender && data.content) {
        const div = document.createElement('div');
        div.textContent = `${data.sender}: ${data.content}`;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
      }

      // Show marker for user location
      if (data.lat && data.lng) {
        const label = data.sender || data.sender_ip || "Unknown";
        if (!markers[label]) {
          markers[label] = L.marker([data.lat, data.lng]).addTo(map).bindPopup(label);
        } else {
          markers[label].setLatLng([data.lat, data.lng]);
        }
      }
    };

    function sendMsg() {
      const name = document.getElementById('nameInput').value || "Anonymous";
      const msg = document.getElementById('msgInput').value;
      if (!msg) return;
      ws.send(JSON.stringify({ sender: name, content: msg }));
      document.getElementById('msgInput').value = '';
    }

    function sendLocation(lat, lng) {
      const name = document.getElementById('nameInput').value || "Anonymous";
      ws.send(JSON.stringify({ sender: name, lat, lng }));
    }

    function initMap(lat, lng) {
      myLat = lat;
      myLng = lng;

      map = L.map('map').setView([lat, lng], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: 'Map data © OpenStreetMap contributors',
      }).addTo(map);

      L.marker([lat, lng]).addTo(map).bindPopup("You").openPopup();

      if (ws.readyState === WebSocket.OPEN) {
        sendLocation(lat, lng);
      } else {
        ws.onopen = () => sendLocation(lat, lng);
      }
    }

    navigator.geolocation.getCurrentPosition(
      position => initMap(position.coords.latitude, position.coords.longitude),
      () => {
        alert("Location permission denied. Using fallback location.");
        initMap(28.6139, 77.2090); // Delhi fallback
      }
    );
  </script>
</body>
</html>
